<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HANGUL QUEST</title><style>body{margin:0;font-family:system-ui;background:linear-gradient(#fce5ff,#d7f3ff);color:#49345d}main{max-width:550px;margin:auto;padding:15px}h1{text-align:center;color:#9345b2}.card{background:#ffffffdb;padding:14px;border-radius:18px;margin:10px 0}button{cursor:pointer;border:1px solid #c8a7df;border-radius:9px;background:#fff;padding:10px;font-weight:700;color:#633d87}button:disabled{opacity:.35}.primary{background:#a366db;color:white;width:100%;font-size:17px}#avatars{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.chosen{outline:3px solid #a366db}input{padding:10px;max-width:90%;border-radius:8px;border:1px solid #c8a7df}#arena{height:220px;position:relative;overflow:hidden;background:linear-gradient(#a2dbff 0 70%,#93d482 70%);border-radius:14px}#hero,#enemy{position:absolute;bottom:8px;font-size:67px}#hero{left:10px}#enemy{right:10px}#horn{position:absolute;right:28px;bottom:85px;font-size:24px}#projectile{position:absolute;top:105px;font-size:39px;left:78%;display:none}#shield{position:absolute;left:75px;bottom:45px;font-size:45px;display:none}#bubble{position:absolute;right:7px;top:8px;background:white;padding:7px;border-radius:10px;font-size:12px}.bars{display:flex;justify-content:space-between;font-size:13px;font-weight:800}.bar{background:#ded1e7;height:10px;border-radius:8px;width:45%;overflow:hidden}.bar i{display:block;height:100%;background:#52bd85}#enemybar{background:#ed7c95}.keyboard{display:flex;flex-direction:column;gap:5px}.keyrow{display:flex;justify-content:center;gap:3px}.keyrow button{flex:1;min-width:0;padding:11px 0;font-size:17px}#answer{font-size:29px;font-weight:800;min-height:44px;text-align:center;color:#8847a9}#prompt{text-align:center;font-size:52px}#status{text-align:center;min-height:25px}#timer{text-align:center;font-weight:800}#progress{height:10px;background:#e4d6ed;border-radius:8px;overflow:hidden}#progress i{display:block;height:100%;background:#e69b45;width:100%}#modal{display:none;position:fixed;inset:0;background:#34244acc;align-items:center;justify-content:center;padding:20px;z-index:10}#modal .card{max-width:350px;text-align:center;width:100%}.actions{display:flex;gap:5px}.actions button{flex:1}small{color:#806a8d}#setup input{display:block;margin:8px 0}</style></head><body><main><h1>🌸 HANGUL QUEST ⚔️</h1><section id="setup" class="card"><h3>캐릭터 선택</h3><div id="avatars"></div><p>이름</p><input id="name" value="MyHero" maxlength="14"><p>사진 프로필 (선택)</p><input id="photo" type="file" accept="image/*"><p><small>사진은 브라우저 내부에서만 표시돼. AI 캐릭터 변환은 아직 없어.</small></p><button class="primary" id="create">모험 시작!</button></section><section id="game" hidden><div class="card"><div id="level"></div><div class="bars"><span id="hptext"></span><span id="enemytext"></span></div><div style="display:flex;justify-content:space-between"><div class="bar"><i id="hpbar"></i></div><div class="bar"><i id="enemybar"></i></div></div><div id="arena"><div id="bubble">What is this in Korean?</div><div id="hero">🧑🏻‍🎤</div><div id="enemy">👹</div><div id="horn">🔺</div><div id="projectile"></div><div id="shield">🛡️</div></div><div id="timer">45.0초</div><div id="progress"><i id="timebar"></i></div></div><div class="card"><div id="prompt"></div><div id="answer"></div><div id="status">전투 시작을 눌러줘!</div></div><div class="card"><div class="keyboard" id="keyboard"></div><div class="actions" style="margin-top:9px"><button id="back">⌫ 지우기</button><button id="clear">전체 삭제</button><button id="hint">💡 힌트</button></div></div><button class="primary" id="start">▶ 전투 시작</button><p><small>한글 두벌식 키보드 · 초급 45초 / 중급 30초 / 고급 20초 · 광고 부활 데모</small></p></section></main><div id="modal"><div class="card"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="primary" id="modalButton"></button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const heroes=['🧑🏻‍🎤','👩🏻‍🎤','🧙🏻','👩🏽‍🚀','🧑🏼‍🎓','👩🏾‍🚒'];let hero=0,lv=1,hp=100,enemyHp=100,score=0,coins=0,revived=false,turn=0,typed=[],active=false,deadline=0,timer=null,phase='ready',usedHint=false;const words=[['🍎','사과'],['🌳','나무'],['💧','물'],['🐰','토끼'],['🐱','고양이'],['🥛','우유'],['🍇','포도'],['🍌','바나나'],['🏫','학교'],['🍓','딸기'],['🚗','자동차'],['📚','책']];const rows=['ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔ','ㅁㄴㅇㄹㅎㅗㅓㅏㅣ','ㅋㅌㅊㅍㅠㅜㅡ'];const shifts={'ㅂ':'ㅃ','ㅈ':'ㅉ','ㄷ':'ㄸ','ㄱ':'ㄲ','ㅅ':'ㅆ','ㅐ':'ㅒ','ㅔ':'ㅖ'};let shift=false;const L='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',V='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',T=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];const compound={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};const finals={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};function hangul(a){let out='',i=0;while(i<a.length){let l=L.indexOf(a[i]);if(l<0||i+1>=a.length||V.indexOf(a[i+1])<0){out+=a[i++];continue}let v=a[i+1],p=i+2;if(compound[v+(a[p]||'')]){v=compound[v+a[p]];p++}let t='';if(p<a.length&&T.includes(a[p])&&a[p]){let next=a[p+1];if(!next||!V.includes(next)){t=a[p];if(finals[t+(next||'')]&&(!a[p+2]||!V.includes(a[p+2]))){t=finals[t+next];p+=2}else p++}}out+=String.fromCharCode(44032+(l*21+V.indexOf(v))*28+T.indexOf(t));i=p}return out}function duration(){return lv<=20?45:lv<=60?30:20}function current(){return words[(turn+(lv-1)*3)%words.length]}function draw(){let word=current();$('level').textContent='🇰🇷 서울 · Lv.'+lv+'　⭐ '+score+'　🪙 '+coins;$('hptext').textContent='HERO '+hp+'/100';$('enemytext').textContent='외뿔 도깨비 '+enemyHp+'/100';$('hpbar').style.width=hp+'%';$('enemybar').style.width=enemyHp+'%';$('prompt').textContent=word[0];$('answer').textContent=hangul(typed)||'＿';$('back').disabled=!active||!typed.length;$('clear').disabled=!active||!typed.length;$('hint').disabled=!active||usedHint}function keyboard(){let root=$('keyboard');root.innerHTML='';rows.forEach((line,ri)=>{let row=document.createElement('div');row.className='keyrow';if(ri===2){let b=document.createElement('button');b.textContent=shift?'⇧ ON':'⇧';b.onclick=()=>{shift=!shift;keyboard()};row.appendChild(b)}for(let ch of line){let b=document.createElement('button');b.textContent=shift&&shifts[ch]?shifts[ch]:ch;b.disabled=!active;b.onclick=()=>add(b.textContent);row.appendChild(b)}root.appendChild(row)})}function add(ch){if(!active)return;typed.push(ch);draw();let value=hangul(typed),target=current()[1];if(value===target){success();return}if(!target.startsWith(value)&&typed.length>target.length*3){$('status').textContent='❌ 다시 입력해 봐!';typed=[];draw()}}function stop(){if(timer){clearInterval(timer);timer=null}active=false}function next(){stop();phase='flying';active=true;typed=[];usedHint=false;let d=duration();deadline=performance.now()+d*1000;$('projectile').style.display='block';$('projectile').textContent=current()[0];$('shield').style.display='none';$('status').textContent='What is this in Korean?';$('start').disabled=true;draw();keyboard();timer=setInterval(()=>{if(!active)return;let rem=Math.max(0,(deadline-performance.now())/1000),frac=rem/d;$('timer').textContent=rem.toFixed(1)+'초';$('timebar').style.width=frac*100+'%';$('projectile').style.left=(78-61*(1-frac))+'%';if(rem<=0)miss()},50)}function success(){stop();phase='anim';let rem=Math.max(0,(deadline-performance.now())/1000);score+=100+Math.round(rem*3);coins+=10;$('shield').style.display='block';$('status').textContent='🛡️ '+current()[1]+'! 방어 성공!';$('projectile').style.left='78%';enemyHp=Math.max(0,enemyHp-40);draw();keyboard();setTimeout(()=>{if(phase!=='anim')return;if(enemyHp<=0){phase='won';coins+=50;modal('🏆 STAGE CLEAR!','도깨비 처치! 보상 50골드','다음 레벨',()=>{lv++;hp=Math.min(100,hp+25);enemyHp=100;turn=0;revived=false;hideModal();next()})}else{turn++;next()}},850)}function miss(){stop();phase='anim';hp=Math.max(0,hp-25);$('status').textContent='💥 피격! HP -25';draw();keyboard();setTimeout(()=>{if(phase!=='anim')return;if(hp<=0){phase='lost';modal('💔 GAME OVER','광고 부활은 실제 광고가 아닌 데모야.',revived?'처음부터 다시':'광고 보고 부활 (데모)',()=>{if(revived){reset()}else{revived=true;hp=50;hideModal();next()}})}else{turn++;next()}},700)}function modal(title,desc,label,fn){$('modalTitle').textContent=title;$('modalText').textContent=desc;$('modalButton').textContent=label;$('modalButton').onclick=fn;$('modal').style.display='flex'}function hideModal(){$('modal').style.display='none'}function reset(){stop();lv=1;hp=100;enemyHp=100;score=0;coins=0;turn=0;revived=false;phase='ready';typed=[];hideModal();$('start').disabled=false;$('status').textContent='전투 시작을 눌러줘!';$('projectile').style.display='none';$('shield').style.display='none';$('timer').textContent='45.0초';$('timebar').style.width='100%';draw();keyboard()}heroes.forEach((h,i)=>{let b=document.createElement('button');b.textContent=h;b.style.fontSize='32px';if(i===0)b.classList.add('chosen');b.onclick=()=>{hero=i;document.querySelectorAll('#avatars button').forEach((x,j)=>x.classList.toggle('chosen',j===i))};$('avatars').appendChild(b)});$('create').onclick=()=>{const f=$('photo').files[0];if(f&&f.type.startsWith('image/')&&f.size<=5e6){let url=URL.createObjectURL(f);$('hero').innerHTML='';let im=document.createElement('img');im.src=url;im.style.cssText='width:68px;height:68px;object-fit:cover;border-radius:50%;border:3px solid white';$('hero').appendChild(im)}else $('hero').textContent=heroes[hero];$('setup').hidden=true;$('game').hidden=false;reset()};$('start').onclick=()=>{if(phase==='ready')next()};$('back').onclick=()=>{typed.pop();draw()};$('clear').onclick=()=>{typed=[];draw()};$('hint').onclick=()=>{usedHint=true;$('status').textContent='💡 정답: '+current()[1];draw()};document.addEventListener('keydown',e=>{if(!active||e.target.tagName==='INPUT')return;if(e.key==='Backspace'){typed.pop();draw();return}let map={'q':'ㅂ','w':'ㅈ','e':'ㄷ','r':'ㄱ','t':'ㅅ','y':'ㅛ','u':'ㅕ','i':'ㅑ','o':'ㅐ','p':'ㅔ','a':'ㅁ','s':'ㄴ','d':'ㅇ','f':'ㄹ','g':'ㅎ','h':'ㅗ','j':'ㅓ','k':'ㅏ','l':'ㅣ','z':'ㅋ','x':'ㅌ','c':'ㅊ','v':'ㅍ','b':'ㅠ','n':'ㅜ','m':'ㅡ'};let c=map[e.key.toLowerCase()];if(c){if(e.shiftKey&&shifts[c])c=shifts[c];add(c);e.preventDefault()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){stop();phase='ready';$('start').disabled=false;$('status').textContent='일시 중단 · 다시 전투 시작을 눌러줘';$('projectile').style.display='none';keyboard()}});
})();
</script></body></html>
